
<!DOCTYPE html>
<html>
<head>
    <title>Student Records</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px lightgray;
        }

        h1 {
            color: #234c80;
        }

        button {
            background-color: #234c80;
            color: white;
            border: none;
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #16365e;
        }

        #output {
            background-color: #f2f5f9;
            padding: 15px;
            border-radius: 5px;
            line-height: 1.8;
            min-height: 30px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Records</h1>

        <button onclick="displayStudents()">Display Students</button>
        <button onclick="searchStudent()">Search Student</button>
        <button onclick="addStudent()">Add Student</button>
        <button onclick="removeStudent()">Remove Student</button>
        <button onclick="countStudents()">Count Students</button>
        <button onclick="uppercaseNames()">Uppercase Names</button>

        <h3>Output:</h3>
        <p id="output">Student names will appear here</p>
    </div>

    <script src="app.js"></script>

</body>
</html>
